name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Components
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false   # toolkit is the root repo, not a consumer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/git-hooks/*

      - name: Sync registry
        run: python3 scripts/sync_registry.py

      - name: Validate catalog
        run: python3 scripts/validate.py

      - name: Check registry is committed
        # Fails if registry.json or context snapshots have uncommitted structural
        # changes after sync. Ignores last_updated timestamp (always regenerated).
        run: |
          REGISTRY_DRIFT=$(git diff registry.json | grep '^[+-]' | grep -v '^---\|^+++\|last_updated' || true)
          if [ -n "$REGISTRY_DRIFT" ]; then
            echo "::error::registry.json has uncommitted structural changes."
            echo "Run 'make sync' and commit the result."
            exit 1
          fi
          git diff --exit-code context/ || {
            echo "::error::context/ snapshots have uncommitted changes."
            echo "Run 'make sync' and commit the result."
            exit 1
          }
